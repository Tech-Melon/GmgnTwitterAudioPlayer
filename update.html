<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GMGN 盯盘伴侣 · 更新说明</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --card: #fff;
            --text: #1d1d1f;
            --sec: #86868b;
            --primary: #34c759;
            --border: #e5e5ea;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1c1c1e;
                --card: #2c2c2e;
                --text: #f5f5f7;
                --sec: #98989d;
                --border: #3a3a3c;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.55;
            min-height: 100vh;
        }
        .wrap {
            max-width: 640px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }
        .hero {
            background: var(--card);
            border-radius: 16px;
            padding: 24px 22px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.06);
            margin-bottom: 16px;
        }
        .hero h1 {
            margin: 0 0 8px;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .badge {
            display: inline-block;
            background: rgba(52, 199, 89, 0.15);
            color: var(--primary);
            font-size: 13px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 999px;
        }
        .meta {
            color: var(--sec);
            font-size: 13px;
            margin: 0 0 16px;
        }
        .hero ul {
            margin: 0;
            padding-left: 20px;
        }
        .hero li {
            margin-bottom: 8px;
            font-size: 14px;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }
        button, .btn {
            appearance: none;
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-outline {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }
        .history {
            background: var(--card);
            border-radius: 16px;
            padding: 18px 22px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.06);
        }
        .history h2 {
            margin: 0 0 12px;
            font-size: 15px;
            color: var(--sec);
            font-weight: 600;
        }
        details {
            border-top: 1px solid var(--border);
            padding: 10px 0;
        }
        details:first-of-type { border-top: none; }
        summary {
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            user-select: none;
        }
        details ul {
            margin: 8px 0 0;
            padding-left: 18px;
            color: var(--sec);
            font-size: 13px;
        }
        .tip {
            margin-top: 16px;
            font-size: 12px;
            color: var(--sec);
            line-height: 1.45;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="hero">
            <h1><span>🍉</span> GMGN 盯盘伴侣已更新</h1>
            <p class="meta">
                当前版本 <span class="badge" id="verBadge">—</span>
                <span id="reasonText"></span>
            </p>
            <ul id="mainList"></ul>
            <div class="actions">
                <button type="button" class="btn-primary" id="btnGotIt">知道了，关闭此页</button>
                <button type="button" class="btn-outline" id="btnOpenPopup">打开插件设置说明</button>
            </div>
            <p class="tip">
                使用提示：更新后请打开 GMGN 页面按 F5 刷新，并点击页面任意处一次（解锁声音）。
                解锁后再切到其它网页，后台播报才会正常工作。
            </p>
        </div>
        <div class="history">
            <h2>历史版本</h2>
            <div id="historyList"></div>
        </div>
    </div>
    <!-- MV3 扩展页 CSP 禁止 inline script，逻辑必须放外置 js -->
    <script src="update-notes.js"></script>
    <script src="update-page.js"></script>
</body>
</html>
